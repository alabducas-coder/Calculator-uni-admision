<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora CASIO HL-4A — 8 dígitos</title>
<style>
  :root{
    --body:#474b53; --bezel:#3b3542; --lcd:#d8e2d6; --seg:#141414;
    --ghost:#bfc8ba; --key:#2e2b28; --keyhi:#4a4540; --red:#a05b6e; --redhi:#b06b7e;
  }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(1200px 700px at 50% 20%, #2c2f36, #17181c 70%);
    font-family:"Segoe UI", system-ui, Arial, sans-serif; color:#eee; gap:14px; padding:16px;
  }
  h1{font-size:15px; font-weight:600; letter-spacing:.4px; margin:0; color:#cfd2da;}
  h1 small{color:#8d93a1; font-weight:400;}
  .device{
    width:380px; max-width:96vw; background:var(--body); border-radius:22px;
    padding:14px 0 22px; box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .brand{text-align:center; color:#ededf2;}
  .brand .logo{font-size:22px; font-weight:700; letter-spacing:2px;}
  .brand .sub{font-size:11px; color:#b9b3bf; letter-spacing:1px; margin-top:2px;}
  .brand .model{font-size:12px; color:#c9c3cf; margin-top:2px;}
  .bezel{margin:12px 18px 0; background:var(--bezel); border-radius:14px; padding:10px;}
  .lcd{background:var(--lcd); border-radius:8px; height:96px; position:relative; overflow:hidden;
       box-shadow:inset 0 2px 6px rgba(0,0,0,.25);}
  .ind{position:absolute; top:8px; left:14px; right:14px; font-size:11px; font-weight:700;
       color:var(--ghost); display:flex; gap:18px; letter-spacing:.5px;}
  .ind span.on{color:var(--seg);}
  .digits{position:absolute; left:10px; right:12px; bottom:8px; height:52px;
          display:flex; justify-content:flex-end; align-items:flex-end; gap:3px;}
  .digits svg{display:block;}
  .digits .dot{width:8px; height:52px; position:relative;}
  .digits .dot i{position:absolute; right:0; bottom:0; width:6px; height:6px; background:var(--seg);}
  .keys{margin:14px 20px 0; display:grid; gap:10px;}
  .row1{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:10px;}
  .row1 button{height:36px; font-size:14px;}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  button{
    border:0; border-radius:10px; background:var(--key); color:#f0f0f0;
    font:600 19px "Segoe UI", system-ui, sans-serif; height:54px; cursor:pointer;
    box-shadow:0 2px 0 #201d24; touch-action:manipulation;
  }
  button:active, button.pressed{background:var(--keyhi); transform:translateY(1px); box-shadow:0 1px 0 #201d24;}
  button.red{background:var(--red);}
  button.red:active, button.red.pressed{background:var(--redhi);}
  footer{font-size:12px; color:#7d8290; text-align:center; max-width:520px; line-height:1.5;}
  kbd{background:#2a2d34; border:1px solid #3a3e47; border-radius:4px; padding:0 5px; font-size:11px;}
</style>
</head>
<body>
<h1>Calculadora CASIO HL-4A <small>· emulador de bolsillo · 8 dígitos</small></h1>
<div class="device" id="device">
  <div class="brand">
    <div class="logo">CASIO</div>
    <div class="sub">ELECTRONIC CALCULATOR</div>
    <div class="model">HL-4A</div>
  </div>
  <div class="bezel">
    <div class="lcd">
      <div class="ind">
        <span id="indMinus">- MINUS</span>
        <span id="indMem">MEMORY</span>
      </div>
      <div class="digits" id="digits"></div>
    </div>
  </div>
  <div class="keys">
    <div class="row1">
      <button data-k="MRC">MRC</button>
      <button data-k="M-">M−</button>
      <button data-k="M+">M+</button>
      <button data-k="SQ">√</button>
      <button data-k="OFF">OFF</button>
    </div>
    <div class="grid">
      <button class="red" data-k="AC">AC</button>
      <button class="red" data-k="C">C</button>
      <button data-k="SIGN">+/−</button>
      <button data-k="PCT">%</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="DIV">÷</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="MUL">×</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="SUB">−</button>
      <button data-k="0">0</button><button data-k="DOT">•</button><button data-k="EQ">=</button><button data-k="ADD">+</button>
    </div>
  </div>
</div>
<footer>
  Atajos de teclado: <kbd>0-9</kbd> dígitos · <kbd>+</kbd><kbd>-</kbd><kbd>*</kbd><kbd>/</kbd> operaciones ·
  <kbd>Enter</kbd> = · <kbd>Esc</kbd> AC · <kbd>Supr</kbd> C · <kbd>%</kbd> porcentaje · <kbd>R</kbd> √
</footer>

<script>
"use strict";
/* ================= logica (espejo de src/hl4a_core.h) ================= */
const S = {power:1, err:0, acc:0, op:0, cur:0, entering:0, entry:"", negEntry:0,
           mem:0, justEq:0, lastB:0, lastOp:0, mrcArmed:0};

const entryDigits = () => S.entry.replace(/[.-]/g,"").length;
const entryValue  = () => parseFloat((S.negEntry?"-":"") + (S.entry==="."?"0.":S.entry)) || 0;
const shownValue  = () => S.entering ? entryValue() : S.cur;

function fmtNumber(v){
  if(!isFinite(v)) return null;
  const a=Math.abs(v);
  if(a>=99999999.5) return null;
  let dec;
  if(a>=1){ const intd=Math.floor(Math.log10(a))+1; dec=Math.max(0,8-intd); }
  else dec=8;
  let t=a.toFixed(dec);
  if(t.includes(".")){ t=t.replace(/0+$/,"").replace(/\.$/,""); }
  if(t.replace(/[.-]/g,"").length>8) return null;
  if(t==="0"||t==="") return "0";
  return (v<-1e-9 && parseFloat(t)!==0 ? "-":"") + t;
}
function setErr(){ S.err=1; S.entering=0; S.op=0; }
function apply(a,op,b){ return op==="+"?a+b: op==="-"?a-b: op==="*"?a*b: (b===0?Infinity:a/b); }
function store(r){
  if(!isFinite(r)||Math.abs(r)>=99999999.5){ setErr(); return false; }
  const f=fmtNumber(r);
  if(f===null){ setErr(); return false; }
  S.cur=parseFloat(f);
  return true;
}
function keyDigit(d){
  if(!S.power||S.err) return;
  S.mrcArmed=0;
  if(S.entering){ if(entryDigits()>=8) return; S.entry+=d; }
  else{ S.entering=1; S.negEntry=0; S.entry=String(d);
        if(S.justEq){S.op=0;S.lastOp=0;S.justEq=0;} }
}
function keyDot(){
  if(!S.power||S.err) return;
  S.mrcArmed=0;
  if(S.entering){ if(S.entry.includes(".")||entryDigits()>=8) return; S.entry+="."; }
  else{ S.entering=1; S.negEntry=0; S.entry="0.";
        if(S.justEq){S.op=0;S.lastOp=0;S.justEq=0;} }
}
function keySign(){
  if(!S.power||S.err) return;
  if(S.entering){ if(S.entry!=="0") S.negEntry^=1; }
  else S.cur=-S.cur;
}
function keyOp(op){
  if(!S.power||S.err) return;
  S.mrcArmed=0; S.justEq=0;
  if(S.entering){
    const v=entryValue();
    if(S.op){ const r=apply(S.acc,S.op,v); if(!store(r)) return; S.acc=S.cur; }
    else S.acc=v;
    S.entering=0;
  }else if(!S.op){ S.acc=S.cur; }
  S.op=op;
}
function keyEq(){
  if(!S.power||S.err) return;
  S.mrcArmed=0;
  if(S.op){
    const b=S.entering?entryValue():S.cur;
    const r=apply(S.acc,S.op,b);
    S.lastB=b; S.lastOp=S.op; S.op=0; S.entering=0;
    if(!store(r)) return;
    S.justEq=1;
  }else if(S.justEq&&S.lastOp){
    const r=apply(S.cur,S.lastOp,S.lastB);
    if(!store(r)) return;
  }
}
function keyPct(){
  if(!S.power||S.err) return;
  const v=shownValue();
  S.entering=0; S.justEq=0;
  if(S.op==="+"||S.op==="-"){ const t=Math.abs(S.acc*v/100); store(t); }
  else if(S.op==="*"){ const r=S.acc*v/100; S.op=0; store(r); }
  else if(S.op==="/"){ const d2=v/100; if(d2===0){setErr();return;} const r=S.acc/d2; S.op=0; store(r); }
  else store(v/100);
}
function keySqrt(){
  if(!S.power||S.err) return;
  const v=shownValue();
  if(v<0){ setErr(); return; }
  S.entering=0; S.justEq=0;
  store(Math.sqrt(v));
}
function keyMplus(s){
  if(!S.power||S.err) return;
  const v=shownValue();
  S.mem+=s*v;
  if(Math.abs(S.mem)>=99999999.5) S.mem=s>0?99999999:-99999999;
  S.entering=0; S.justEq=0; S.mrcArmed=0;
}
function keyMrc(){
  if(!S.power||S.err) return;
  if(S.mrcArmed){ S.mem=0; S.cur=0; S.mrcArmed=0; }
  else{ S.entering=0; S.cur=S.mem; S.justEq=0; S.mrcArmed=1; }
}
function keyC(){ if(!S.power) return; S.err=0;S.entering=0;S.entry="";S.negEntry=0;S.justEq=0;S.mrcArmed=0; }
function keyAC(){ const m=S.mem; Object.assign(S,{power:1,err:0,acc:0,op:0,cur:0,entering:0,entry:"",negEntry:0,justEq:0,lastB:0,lastOp:0,mrcArmed:0,mem:m}); }
function keyOff(){ S.power=0; }

/* ================= display 7 segmentos (SVG) ================= */
function segPolys(w,h){
  const t=Math.max(3,Math.floor(h/7)), t2=Math.floor(t/2), ym=Math.floor(h/2);
  return {
    A:[[t2,0],[w-t2,0],[w-t,t2],[w-t2,t],[t2,t],[t,t2]],
    B:[[w-t,t2],[w,t2],[w,ym-t2],[w-t,ym-t],[w-t2,ym-t2],[w-t2,t]],
    C:[[w-t,ym+t2],[w,ym+t2],[w,h-t2],[w-t,h-t2],[w-t2,h-t],[w-t2,ym+t]],
    D:[[t2,h],[w-t2,h],[w-t,h-t2],[w-t2,h-t],[t2,h-t],[t,h-t2]],
    E:[[t,ym+t2],[t2,ym+t],[t2,h-t],[t,h-t2],[0,h-t2],[0,ym+t2]],
    F:[[t,t2],[t2,t],[t2,ym-t2],[t,ym-t],[0,ym-t2],[0,t2]],
    G:[[t,ym-t2],[t2,ym],[t,ym+t2],[w-t,ym+t2],[w-t2,ym],[w-t,ym-t2]],
  };
}
const SEGMAP={"0":"ABCDEF","1":"BC","2":"ABGED","3":"ABGCD","4":"FGBC","5":"AFGCD",
              "6":"AFGEDC","7":"ABC","8":"ABCDEFG","9":"ABCDFG","-":"G","E":"AFGED"};
const P=segPolys(27,46);
function digitSVG(ch){
  const on=SEGMAP[ch]||"";
  let inner="";
  for(const s of "ABCDEFG") if(on.includes(s))
    inner+=`<polygon points="${P[s].map(p=>p.join(",")).join(" ")}" fill="var(--seg)"/>`;
  return `<svg width="27" height="46" viewBox="0 0 27 46">${inner}</svg>`;
}
function render(){
  document.getElementById("indMinus").className = (S.power&&shownValue()<0)?"on":"";
  document.getElementById("indMem").className   = (S.power&&S.mem!==0)?"on":"";
  const box=document.getElementById("digits");
  let disp="";
  if(!S.power) disp="";
  else if(S.err) disp="E";
  else if(S.entering) disp=(S.negEntry?"-":"")+S.entry;
  else disp=fmtNumber(S.cur)??"E";
  let html="";
  for(const c of disp){
    if(c===".") html+=`<span class="dot"><i></i></span>`;
    else html+=digitSVG(c);
  }
  box.innerHTML=html||"";
}

/* ================= eventos ================= */
const ACTIONS={
  AC:keyAC, C:keyC, SIGN:keySign, PCT:keyPct, SQ:keySqrt,
  MRC:keyMrc, "M+":()=>keyMplus(1), "M-":()=>keyMplus(-1), OFF:keyOff,
  ADD:()=>keyOp("+"), SUB:()=>keyOp("-"), MUL:()=>keyOp("*"), DIV:()=>keyOp("/"),
  EQ:keyEq, DOT:keyDot,
};
for(let i=0;i<10;i++) ACTIONS[String(i)]=()=>keyDigit(i);

function press(k){
  (ACTIONS[k]||(()=>{}))();
  render();
}
document.querySelectorAll("button[data-k]").forEach(b=>{
  b.addEventListener("click",()=>press(b.dataset.k));
});
window.addEventListener("keydown",e=>{
  const map={
    ".":"DOT",",":"DOT","+":"ADD","-":"SUB","*":"MUL","/":"DIV","=":"EQ",
    "Enter":"EQ","Escape":"AC","Backspace":"C","Delete":"C","%":"PCT","r":"SQ","R":"SQ",
  };
  if(e.key>="0"&&e.key<="9"){ press(e.key); return; }
  const k=map[e.key];
  if(k){ e.preventDefault(); press(k); }
});
render();
</script>
</body>
</html>
